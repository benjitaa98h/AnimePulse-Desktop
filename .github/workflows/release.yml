name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Install system deps para AppImage (fuse/libfuse, etc.)
        run: sudo apt-get update && sudo apt-get install -y libfuse2 2>/dev/null || true

      - name: Build AppImage y deb
        run: npx electron-builder --linux AppImage deb

      - name: Crear release y subir assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -e "console.log(require('./package.json').version)")"
          echo "Versión de package.json: $VERSION"
          NOTES="/tmp/release-notes.md"
          {
            echo "## AnimePulse v$VERSION"
            echo
            echo "Release generada automáticamente por GitHub Actions al publicar el tag \`${{ github.ref_name }}\`."
            echo
            echo "### Acerca de este flujo"
            echo "Para releasear: bumpa la versión en \`package.json\`, hacé commit y luego tag + push:"
            echo "\`\`\`"
            echo "git tag v$VERSION"
            echo "git push origin v$VERSION"
            echo "\`\`\`"
            echo "GitHub Actions compila el AppImage y el .deb y sube la release automáticamente."
          } > "$NOTES"
          gh release create "v$VERSION" \
            --title "AnimePulse v$VERSION" \
            --notes-file "$NOTES" \
            "dist/AnimePulse-${VERSION}.AppImage" \
            "dist/animepulse_${VERSION}_amd64.deb" \
            "dist/latest-linux.yml"
          echo "Publicada: $(gh release view "v$VERSION" --json url -q .url)"