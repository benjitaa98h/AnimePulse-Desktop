name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a buildear/publicar (ej. 2.0.6). Se bumpa en package.json durante el build.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tests unitarios
        run: npm test

      - name: Determinar versión (tag o dispatch) y preparar package.json
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Versión inválida: $VERSION"; exit 1; }
            node -e "const fs=require('fs');const p='package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version='$VERSION';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"
          else
            VERSION="$(node -e "console.log(require('./package.json').version)")"
          fi
          echo "Se va a buildear/publicar: v$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Instalar deps de sistema para AppImage
        run: sudo apt-get update && sudo apt-get install -y libfuse2 2>/dev/null || true

      - name: Build AppImage y deb
        run: npx electron-builder --linux AppImage deb

      - name: Crear release y subir assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$VERSION"
          NOTES="/tmp/release-notes.md"
          {
            echo "## AnimePulse v$VERSION"
            echo
            echo "Generada por GitHub Actions $([ "${{ github.event_name }}" == "workflow_dispatch" ] && echo '(disparo manual desde GitHub)' || echo "(push del tag v$VERSION)")"
          } > "$NOTES"
          gh release create "v$VERSION" \
            --title "AnimePulse v$VERSION" \
            --notes-file "$NOTES" \
            "dist/AnimePulse-${VERSION}.AppImage" \
            "dist/animepulse_${VERSION}_amd64.deb" \
            "dist/latest-linux.yml"
          echo "Publicada: $(gh release view "v$VERSION" --json url -q .url)"